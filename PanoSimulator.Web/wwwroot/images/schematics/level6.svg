<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #fff; font-family: 'Segoe UI', Arial, sans-serif;">
    <defs>
        <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
            <circle cx="5" cy="5" r="5" fill="#000" />
        </marker>
    </defs>

    <!-- Title -->
    <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#2d3748">Seviye 6: İleri - Geri Çalıştırma (Ters Kilitlemeli)</text>
    <text x="400" y="65" font-size="14" text-anchor="middle" fill="#718096">2 Kontaktör (İleri ve Geri) ile motor dönüş yönünü değiştirme</text>

    <!-- Phase lines -->
    <line x1="50" y1="120" x2="750" y2="120" stroke="#000" stroke-width="2" />
    <text x="30" y="125" font-size="14" font-weight="bold">L1</text>

    <line x1="50" y1="520" x2="750" y2="520" stroke="#000" stroke-width="2" />
    <text x="30" y="525" font-size="14" font-weight="bold">N</text>

    <!-- Circuit Branch -->
    <g transform="translate(150, 0)">
        <line x1="0" y1="120" x2="0" y2="160" stroke="#000" stroke-width="2" marker-start="url(#dot)" />
        
        <!-- Breaker Q1 -->
        <text x="25" y="195" font-size="14" font-weight="bold" fill="#2b6cb0">Q1</text>
        <text x="25" y="215" font-size="12" fill="#4a5568">Otomat</text>
        <line x1="0" y1="160" x2="-10" y2="175" stroke="#000" stroke-width="2" />
        <line x1="-10" y1="175" x2="-10" y2="205" stroke="#000" stroke-width="2" />
        <line x1="-10" y1="205" x2="0" y2="220" stroke="#000" stroke-width="2" />
        
        <!-- Stop Button (NC) -->
        <line x1="0" y1="220" x2="0" y2="250" stroke="#000" stroke-width="2" />
        <text x="25" y="275" font-size="14" font-weight="bold" fill="#e53e3e">S0</text>
        <text x="25" y="295" font-size="12" fill="#4a5568">Stop</text>
        <circle cx="0" cy="250" r="4" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="-15" y1="265" x2="15" y2="265" stroke="#000" stroke-width="2" />
        <line x1="0" y1="265" x2="0" y2="290" stroke="#000" stroke-width="2" />
        <circle cx="0" cy="290" r="4" fill="#fff" stroke="#000" stroke-width="2" />

        <!-- Split to Forward and Reverse -->
        <line x1="0" y1="294" x2="0" y2="310" stroke="#000" stroke-width="2" />
        <line x1="0" y1="310" x2="300" y2="310" stroke="#000" stroke-width="2" marker-start="url(#dot)" />

        <!-- ========================================== -->
        <!-- FORWARD BRANCH (İleri) -->
        <!-- ========================================== -->
        <!-- Start Button FWD -->
        <line x1="0" y1="310" x2="0" y2="330" stroke="#000" stroke-width="2" />
        <text x="-35" y="355" font-size="14" font-weight="bold" fill="#38a169">S1</text>
        <text x="-35" y="375" font-size="12" fill="#4a5568">İleri</text>
        <circle cx="0" cy="330" r="4" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="-15" y1="350" x2="15" y2="350" stroke="#000" stroke-width="2" />
        <line x1="0" y1="350" x2="0" y2="340" stroke="#000" stroke-width="2" />
        <circle cx="0" cy="370" r="4" fill="#fff" stroke="#000" stroke-width="2" />

        <!-- Interlock NC Contact from K2 (Geri) -->
        <line x1="0" y1="374" x2="0" y2="390" stroke="#000" stroke-width="2" />
        <text x="25" y="415" font-size="14" font-weight="bold" fill="#d69e2e">K2 (NC)</text>
        <text x="25" y="435" font-size="12" fill="#4a5568">Elektriksel Kilit</text>
        <circle cx="0" cy="390" r="4" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="-15" y1="405" x2="15" y2="405" stroke="#000" stroke-width="2" />
        <line x1="0" y1="405" x2="0" y2="430" stroke="#000" stroke-width="2" />
        <circle cx="0" cy="430" r="4" fill="#fff" stroke="#000" stroke-width="2" />
        <text x="-25" y="395" font-size="10">21</text>
        <text x="-25" y="425" font-size="10">22</text>

        <!-- Contactor Coil (K1 - İleri) -->
        <line x1="0" y1="434" x2="0" y2="450" stroke="#000" stroke-width="2" />
        <rect x="-20" y="450" width="40" height="40" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="-20" y1="450" x2="20" y2="490" stroke="#000" stroke-width="2" />
        <text x="-35" y="460" font-size="10">A1</text>
        <text x="-35" y="485" font-size="10">A2</text>
        <text x="30" y="475" font-size="14" font-weight="bold" fill="#3182ce">K1 (İleri)</text>
        <line x1="0" y1="490" x2="0" y2="520" stroke="#000" stroke-width="2" marker-end="url(#dot)" />

        <!-- ========================================== -->
        <!-- REVERSE BRANCH (Geri) -->
        <!-- ========================================== -->
        <!-- Start Button REV -->
        <line x1="300" y1="310" x2="300" y2="330" stroke="#000" stroke-width="2" />
        <text x="325" y="355" font-size="14" font-weight="bold" fill="#38a169">S2</text>
        <text x="325" y="375" font-size="12" fill="#4a5568">Geri</text>
        <circle cx="300" cy="330" r="4" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="285" y1="350" x2="315" y2="350" stroke="#000" stroke-width="2" />
        <line x1="300" y1="350" x2="300" y2="340" stroke="#000" stroke-width="2" />
        <circle cx="300" cy="370" r="4" fill="#fff" stroke="#000" stroke-width="2" />

        <!-- Interlock NC Contact from K1 (İleri) -->
        <line x1="300" y1="374" x2="300" y2="390" stroke="#000" stroke-width="2" />
        <text x="325" y="415" font-size="14" font-weight="bold" fill="#3182ce">K1 (NC)</text>
        <text x="325" y="435" font-size="12" fill="#4a5568">Elektriksel Kilit</text>
        <circle cx="300" cy="390" r="4" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="285" y1="405" x2="315" y2="405" stroke="#000" stroke-width="2" />
        <line x1="300" y1="405" x2="300" y2="430" stroke="#000" stroke-width="2" />
        <circle cx="300" cy="430" r="4" fill="#fff" stroke="#000" stroke-width="2" />
        <text x="275" y="395" font-size="10">21</text>
        <text x="275" y="425" font-size="10">22</text>

        <!-- Contactor Coil (K2 - Geri) -->
        <line x1="300" y1="434" x2="300" y2="450" stroke="#000" stroke-width="2" />
        <rect x="280" y="450" width="40" height="40" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="280" y1="450" x2="320" y2="490" stroke="#000" stroke-width="2" />
        <text x="265" y="460" font-size="10">A1</text>
        <text x="265" y="485" font-size="10">A2</text>
        <text x="330" y="475" font-size="14" font-weight="bold" fill="#d69e2e">K2 (Geri)</text>
        <line x1="300" y1="490" x2="300" y2="520" stroke="#000" stroke-width="2" marker-end="url(#dot)" />
    </g>

    <!-- Legend -->
    <rect x="50" y="420" width="300" height="90" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" rx="4" />
    <text x="60" y="440" font-size="12" font-weight="bold" fill="#4a5568">Elektriksel Kilitleme:</text>
    <text x="60" y="455" font-size="11" fill="#718096">İki kontaktörün aynı anda çekip 3 fazı kısa devre yapmasını önler.</text>
    <text x="60" y="475" font-size="11" fill="#718096">İleri (K1) butonuna basıldığında akım Geri (K2) NC üzerinden geçer.</text>
    <text x="60" y="490" font-size="11" fill="#718096">Geri dönerken K2 çektiği için NC açılır; K1 butonuna basılamaz!</text>

</svg>
