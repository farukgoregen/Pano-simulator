<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #fff; font-family: 'Segoe UI', Arial, sans-serif;">
    <defs>
        <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
            <circle cx="5" cy="5" r="5" fill="#000" />
        </marker>
    </defs>

    <!-- Title -->
    <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#2d3748">Seviye 8: Sınır Anahtarı (Limit Switch) ile Durdurma</text>
    <text x="400" y="65" font-size="14" text-anchor="middle" fill="#718096">Sensöre çarpıldığında motorun enerjisi kesilir</text>

    <!-- Phase lines -->
    <line x1="50" y1="120" x2="750" y2="120" stroke="#000" stroke-width="2" />
    <text x="30" y="125" font-size="14" font-weight="bold">L1</text>

    <line x1="50" y1="520" x2="750" y2="520" stroke="#000" stroke-width="2" />
    <text x="30" y="525" font-size="14" font-weight="bold">N</text>

    <!-- Circuit Branch -->
    <g transform="translate(350, 0)">
        <line x1="0" y1="120" x2="0" y2="160" stroke="#000" stroke-width="2" marker-start="url(#dot)" />
        
        <!-- Breaker Q1 -->
        <text x="25" y="195" font-size="14" font-weight="bold" fill="#2b6cb0">Q1</text>
        <text x="25" y="215" font-size="12" fill="#4a5568">Otomat</text>
        <line x1="0" y1="160" x2="-10" y2="175" stroke="#000" stroke-width="2" />
        <line x1="-10" y1="175" x2="-10" y2="205" stroke="#000" stroke-width="2" />
        <line x1="-10" y1="205" x2="0" y2="220" stroke="#000" stroke-width="2" />
        
        <!-- Stop Button S0 -->
        <line x1="0" y1="220" x2="0" y2="260" stroke="#000" stroke-width="2" />
        <text x="25" y="285" font-size="14" font-weight="bold" fill="#e53e3e">S0 (Stop)</text>
        <circle cx="0" cy="260" r="4" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="-15" y1="280" x2="15" y2="280" stroke="#000" stroke-width="2" />
        <line x1="0" y1="280" x2="0" y2="270" stroke="#000" stroke-width="2" />
        <circle cx="0" cy="300" r="4" fill="#fff" stroke="#000" stroke-width="2" />

        <!-- Limit Switch (NC) -->
        <line x1="0" y1="304" x2="0" y2="340" stroke="#000" stroke-width="2" />
        <text x="25" y="365" font-size="14" font-weight="bold" fill="#805ad5">SQ1 (Limit Switch)</text>
        <text x="25" y="385" font-size="12" fill="#4a5568">Sensöre çarpınca açılır</text>
        <circle cx="0" cy="340" r="4" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="-15" y1="360" x2="15" y2="360" stroke="#000" stroke-width="2" />
        <line x1="0" y1="360" x2="0" y2="350" stroke="#000" stroke-width="2" />
        <!-- Mechanical roller symbol -->
        <circle cx="20" cy="360" r="3" fill="#805ad5" />
        <circle cx="0" cy="380" r="4" fill="#fff" stroke="#000" stroke-width="2" />
        <text x="-25" y="345" font-size="10">11</text>
        <text x="-25" y="385" font-size="10">12</text>

        <!-- Contactor Coil K1 -->
        <line x1="0" y1="384" x2="0" y2="430" stroke="#000" stroke-width="2" />
        <rect x="-20" y="430" width="40" height="40" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="-20" y1="430" x2="20" y2="470" stroke="#000" stroke-width="2" />
        <text x="-35" y="440" font-size="10">A1</text>
        <text x="-35" y="465" font-size="10">A2</text>
        <text x="30" y="455" font-size="14" font-weight="bold" fill="#e53e3e">K1</text>
        <line x1="0" y1="470" x2="0" y2="520" stroke="#000" stroke-width="2" marker-end="url(#dot)" />
    </g>

    <!-- Legend -->
    <rect x="50" y="420" width="220" height="90" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" rx="4" />
    <text x="60" y="440" font-size="12" font-weight="bold" fill="#4a5568">Saha Sensörü / Switch:</text>
    <text x="60" y="455" font-size="11" fill="#718096">SQ1 bir mekanik sınır anahtarıdır.</text>
    <text x="60" y="475" font-size="11" fill="#718096">Normalde kapalı (11-12) üzerinden akım geçer.</text>
    <text x="60" y="490" font-size="11" fill="#718096">Kutu/kapı çarpınca açılır ve kontaktör düşer.</text>

</svg>
