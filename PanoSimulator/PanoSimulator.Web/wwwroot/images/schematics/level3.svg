<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #fff; font-family: 'Segoe UI', Arial, sans-serif;">
    <defs>
        <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
            <circle cx="5" cy="5" r="5" fill="#000" />
        </marker>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
        </marker>
    </defs>

    <!-- Title -->
    <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#2d3748">Seviye 3: Gecikmeli Çalıştırma (Zaman Rölesi)</text>
    <text x="400" y="65" font-size="14" text-anchor="middle" fill="#718096">Zaman Rölesi (TON) ile motor gecikmeli başlar</text>

    <!-- Phase lines -->
    <line x1="50" y1="120" x2="750" y2="120" stroke="#000" stroke-width="2" />
    <text x="30" y="125" font-size="14" font-weight="bold">L1</text>

    <line x1="50" y1="520" x2="750" y2="520" stroke="#000" stroke-width="2" />
    <text x="30" y="525" font-size="14" font-weight="bold">N</text>

    <!-- Circuit Branch -->
    <g transform="translate(300, 0)">
        <line x1="0" y1="120" x2="0" y2="160" stroke="#000" stroke-width="2" marker-start="url(#dot)" />
        
        <!-- Breaker Q1 -->
        <text x="25" y="195" font-size="14" font-weight="bold" fill="#2b6cb0">Q1</text>
        <text x="25" y="215" font-size="12" fill="#4a5568">Otomat</text>
        <line x1="0" y1="160" x2="-10" y2="175" stroke="#000" stroke-width="2" />
        <line x1="-10" y1="175" x2="-10" y2="205" stroke="#000" stroke-width="2" />
        <line x1="-10" y1="205" x2="0" y2="220" stroke="#000" stroke-width="2" />
        
        <!-- Button Start (NO) -->
        <line x1="0" y1="220" x2="0" y2="260" stroke="#000" stroke-width="2" />
        <text x="25" y="285" font-size="14" font-weight="bold" fill="#38a169">S1</text>
        <text x="25" y="305" font-size="12" fill="#4a5568">Start</text>
        <circle cx="0" cy="260" r="4" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="-15" y1="280" x2="15" y2="280" stroke="#000" stroke-width="2" />
        <line x1="0" y1="280" x2="0" y2="270" stroke="#000" stroke-width="2" />
        <circle cx="0" cy="300" r="4" fill="#fff" stroke="#000" stroke-width="2" />

        <!-- Node after start button -->
        <line x1="0" y1="304" x2="0" y2="330" stroke="#000" stroke-width="2" />
        <line x1="0" y1="330" x2="100" y2="330" stroke="#000" stroke-width="2" marker-start="url(#dot)" />

        <!-- Branch 1: Timer Coil (KT) -->
        <line x1="0" y1="330" x2="0" y2="380" stroke="#000" stroke-width="2" />
        <rect x="-20" y="380" width="40" height="40" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="-20" y1="380" x2="-10" y2="380" stroke="#000" stroke-width="2" />
        <line x1="-20" y1="390" x2="-10" y2="390" stroke="#000" stroke-width="2" />
        <text x="-35" y="390" font-size="10">A1</text>
        <text x="-35" y="415" font-size="10">A2</text>
        <text x="30" y="405" font-size="14" font-weight="bold" fill="#d69e2e">KT1</text>
        <text x="30" y="420" font-size="12" fill="#4a5568">Zaman R. (TON)</text>
        <line x1="0" y1="420" x2="0" y2="520" stroke="#000" stroke-width="2" marker-end="url(#dot)" />

        <!-- Branch 2: Timer NO Contact -> Contactor Coil -->
        <line x1="100" y1="330" x2="100" y2="350" stroke="#000" stroke-width="2" />
        <!-- Timer NO Contact (15-18) -->
        <circle cx="100" cy="350" r="4" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="100" y1="354" x2="80" y2="375" stroke="#000" stroke-width="2" />
        <!-- Timing parachute symbol -->
        <path d="M 80 375 Q 85 365 95 375" fill="none" stroke="#000" stroke-width="2" />
        <circle cx="100" cy="380" r="4" fill="#fff" stroke="#000" stroke-width="2" />
        <text x="115" y="355" font-size="10">15</text>
        <text x="115" y="385" font-size="10">18</text>
        <text x="125" y="370" font-size="12" font-weight="bold" fill="#d69e2e">KT1</text>

        <!-- Contactor Coil (K1) -->
        <line x1="100" y1="384" x2="100" y2="430" stroke="#000" stroke-width="2" />
        <rect x="80" y="430" width="40" height="40" fill="#fff" stroke="#000" stroke-width="2" />
        <line x1="80" y1="430" x2="120" y2="470" stroke="#000" stroke-width="2" />
        <text x="65" y="440" font-size="10">A1</text>
        <text x="65" y="465" font-size="10">A2</text>
        <text x="130" y="455" font-size="14" font-weight="bold" fill="#e53e3e">K1</text>
        <line x1="100" y1="470" x2="100" y2="520" stroke="#000" stroke-width="2" marker-end="url(#dot)" />
    </g>

    <!-- Legend -->
    <rect x="50" y="440" width="200" height="70" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" rx="4" />
    <text x="60" y="460" font-size="12" font-weight="bold" fill="#4a5568">Devre Akışı:</text>
    <text x="60" y="475" font-size="11" fill="#718096">1. S1'e (Start) basılı tutulur.</text>
    <text x="60" y="490" font-size="11" fill="#718096">2. KT1 (Zaman Rölesi) saymaya başlar.</text>
    <text x="60" y="505" font-size="11" fill="#718096">3. Süre dolunca K1 (Kontaktör) çeker.</text>

</svg>
